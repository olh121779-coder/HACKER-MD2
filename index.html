<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REHMAN-MD - Official Pair</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;700;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  min-height:100vh;
  background: radial-gradient(circle at 20% 20%, #ff1493 0%, transparent 40%),
              radial-gradient(circle at 80% 80%, #7c00ff 0%, transparent 40%),
              #050005;
  display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;width:200%;height:200%;
  background: radial-gradient(#ffffff08 1px, transparent 1px);
  background-size:40px 40px;
  animation: move 20s linear infinite;
}
@keyframes move{from{transform:translate(0,0)}to{transform:translate(-40px,-40px)}}
.card{
  position:relative;z-index:2;
  background: rgba(15,15,15,0.9);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,20,147,0.4);
  border-radius:30px;
  padding:38px 26px;
  width:92%;max-width:400px;
  text-align:center;
  box-shadow: 0 0 50px rgba(255,20,147,0.3), inset 0 0 20px rgba(255,255,255,0.05);
}
h1{
  font-size:38px;font-weight:800;
  background: linear-gradient(90deg,#ff1493,#ff8ac6,#7c00ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;line-height:1.2;
  text-shadow:0 0 30px #ff149355;
  margin-bottom:5px;
}
.sub{color:#aaa;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:28px}
.input-box{position:relative;margin:10px 0}
.input-box input{
  width:100%;padding:16px 16px 16px 48px;
  border-radius:15px;border:1px solid #333;
  background:#0e0e0e;color:#fff;font-size:15px;
  outline:none;transition:0.3s;
}
.input-box input:focus{border-color:#ff1493;box-shadow:0 0 15px #ff149355}
.input-box span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px}
.btn{
  width:100%;padding:16px;border-radius:15px;border:none;
  background: linear-gradient(90deg,#ff1493,#ff55aa,#7c00ff);
  background-size:200% 200%;color:#fff;font-size:17px;font-weight:700;
  cursor:pointer;margin-top:16px;letter-spacing:1px;
  box-shadow:0 8px 25px #ff149366;
  animation: gradient 3s ease infinite;transition:0.2s;
}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.6}
.code-wrap{margin-top:22px;animation: pop 0.5s ease}
@keyframes pop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.code-box{
  font-size:36px;font-weight:800;letter-spacing:10px;
  background:#000;color:#00ff88;
  padding:18px;border-radius:16px;
  border:2px dashed #00ff88;
  box-shadow:0 0 20px #00ff8855;
}
.wa-btn{
  display:block;width:100%;padding:14px;border-radius:15px;
  background:#111;border:1px solid #25D366;color:#25D366;
  text-decoration:none;font-weight:700;font-size:15px;
  margin-top:18px;transition:0.2s;
}
.wa-btn:hover{background:#25D366;color:#fff;box-shadow:0 0 20px #25D36655}
.loader{
  width:40px;height:40px;border:4px solid #222;border-top:4px solid #ff1493;
  border-radius:50%;margin:20px auto;animation: spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{color:#00ff88;font-size:20px;font-weight:600;margin-top:20px}
.err{color:#ff4d6d;margin-top:15px;background:#ff4d6d15;padding:10px;border-radius:10px;font-size:14px}
.footer{margin-top:18px;font-size:11px;color:#555}
</style>
</head>
<body>
<div class="card">
  <h1>REHMAN-MD</h1>
  <div class="sub">Official Pair System</div>

  <div id="inputArea">
    <div class="input-box">
      <span>📱</span>
      <input id="number" type="text" placeholder="9230XXXXXXX">
    </div>
    <button class="btn" id="genBtn" onclick="generatePair()">GENERATE PAIR CODE</button>
  </div>

  <div id="result"></div>

  <a class="wa-btn" href="https://whatsapp.com/channel/0029VbE5Hc53wtb1OeF8h01y" target="_blank">💚 JOIN WHATSAPP CHANNEL</a>

  <div class="footer">Secured by REHMAN-MD • Railway</div>
</div>

<script>
let currentCode = "";

async function generatePair(){
  const number = document.getElementById('number').value.trim();
  const resDiv = document.getElementById('result');
  const btn = document.getElementById('genBtn');

  if(!number){
    resDiv.innerHTML = `<div class="err">⚠️ Number likho! Ex: 9230XXXXXXX</div>`;
    return;
  }

  btn.disabled = true;
  btn.innerText = "GENERATING...";
  resDiv.innerHTML = `<div class="loader"></div><div style="color:#aaa;font-size:13px">Connecting to WhatsApp...</div>`;

  try{
    // Remote code internally REHMANMD bhej rahe hain
    const res = await fetch(`/pair?number=${encodeURIComponent(number)}&code=REHMANMD`);
    const data = await res.json();
    
    if(data.success){
      currentCode = data.code;
      resDiv.innerHTML = `
        <div class="code-wrap">
          <div style="color:#aaa;font-size:13px;margin-bottom:8px">Pair Code for ${data.number}</div>
          <div class="code-box">${data.code}</div>
          <div style="color:#888;font-size:11px;margin-top:10px">WhatsApp > Linked Devices > Link with phone number<br><span style="color:#ffae00">⏳ Valid 60 sec</span></div>
        </div>`;
      btn.innerText = "GET PAIR CODE";
      btn.disabled = false;
      btn.onclick = copyCode;
      document.getElementById('inputArea').style.display = 'none';
    } else {
      resDiv.innerHTML = `<div class="err">❌ ${data.error}</div>`;
      btn.disabled = false;
      btn.innerText = "GENERATE PAIR CODE";
    }
  } catch(e){
    resDiv.innerHTML = `<div class="err">❌ Error: ${e.message}</div>`;
    btn.disabled = false;
    btn.innerText = "GENERATE PAIR CODE";
  }
}

function copyCode(){
  if(!currentCode) return;
  navigator.clipboard.writeText(currentCode);
  const btn = document.getElementById('genBtn');
  btn.innerText = "✅ CODE COPIED!";
  setTimeout(()=>{ btn.innerText = "GET PAIR CODE"; }, 2000);
}

setInterval(async()=>{
  try{
    const s = await fetch('/status').then(r=>r.json());
    if(s.connected){
      document.getElementById('result').innerHTML = `<div class="ok">✅ BOT CONNECTED<br><span style="font-size:13px;color:#aaa">REHMAN-MD Online hai 💐</span></div>`;
      document.getElementById('genBtn').style.display = 'none';
      document.getElementById('inputArea').style.display = 'none';
    }
  }catch{}
}, 3000);
</script>
</body>
</html>
